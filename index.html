
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101116">
  <title>Textprüfung</title>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    :root {
      color-scheme: dark;
      --bg: #101116;
      --muted: #a5adc0;
      --red: #ff4b55;
      --green: #39df8a;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      padding:
        max(10px, env(safe-area-inset-top))
        max(12px, env(safe-area-inset-right))
        max(10px, env(safe-area-inset-bottom))
        max(12px, env(safe-area-inset-left));
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      color: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }

    main {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
    }

    h1 {
      margin: 4px 0;
      font-size: clamp(25px, 4vw, 36px);
    }

    .subtitle {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 14px;
    }

    .camera-frame {
      position: relative;
      width: 100%;
      height: min(43dvh, 390px);
      min-height: 180px;
      overflow: hidden;
      border: 1px solid #414553;
      border-radius: 14px;
      background: #050506;
    }

    video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #050506;
    }

    .controls {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 520px;
      margin: 12px auto;
    }

    button {
      flex: 1;
      min-width: 0;
      min-height: 46px;
      padding: 10px 8px;
      border: 0;
      border-radius: 11px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    #startButton {
      background: #f5f5f7;
      color: #111216;
    }

    #stopButton {
      background: #30333d;
      color: white;
    }

    #status {
      display: none;
      width: 100%;
      max-width: 520px;
      margin: 12px auto;
      padding: 14px 8px;
      border: 1px solid;
      border-radius: 12px;
      font-size: clamp(23px, 4vw, 32px);
      font-weight: 900;
      overflow-wrap: anywhere;
    }

    #status.blocked {
      display: block;
      color: var(--red);
      border-color: var(--red);
      background: #30171b;
    }

    #status.posted {
      display: block;
      color: var(--green);
      border-color: var(--green);
      background: #11291f;
    }

    #info {
      min-height: 20px;
      margin: 8px auto;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .note {
      max-width: 520px;
      margin: 12px auto;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    @media (orientation: landscape) and (max-height: 600px) {
      body {
        padding-top: 4px;
        padding-bottom: 4px;
      }

      h1 {
        font-size: 23px;
      }

      .subtitle {
        margin-bottom: 6px;
      }

      .camera-frame {
        height: 45dvh;
        min-height: 110px;
      }

      .controls {
        margin: 7px auto;
      }

      button {
        min-height: 38px;
        padding: 6px;
      }

      #status {
        margin: 7px auto;
        padding: 8px;
        font-size: 22px;
      }

      .note {
        display: none;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>Textprüfung</h1>
    <p class="subtitle">Automatische Texterkennung</p>

    <div class="camera-frame">
      <video id="video" autoplay playsinline muted></video>
    </div>

    <div class="controls">
      <button id="startButton">Kamera starten</button>
      <button id="stopButton" disabled>Kamera stoppen</button>
    </div>

    <div id="status" role="status" aria-live="polite"></div>
    <p id="info">Tippe auf „Kamera starten“.</p>

    <p class="note">
      Halte den Text ruhig, gut beleuchtet und möglichst gerade vor die Kamera.
    </p>
  </main>

  <canvas id="canvas" hidden></canvas>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d", {
      willReadFrequently: true
    });

    const startButton = document.getElementById("startButton");
    const stopButton = document.getElementById("stopButton");
    const statusBox = document.getElementById("status");
    const info = document.getElementById("info");

    let stream = null;
    let worker = null;
    let running = false;
    let scanning = false;
    let scanTimer = null;
    let statusTimer = null;
    let lastResult = null;
    let session = 0;

    function normalizeText(text) {
      return (text || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/ß/g, "ss")
        .replace(/[^a-z0-9]/g, "");
    }

    function levenshtein(a, b) {
      const previous = Array.from(
        { length: b.length + 1 },
        (_, i) => i
      );

      for (let i = 1; i <= a.length; i++) {
        const current = [i];

        for (let j = 1; j <= b.length; j++) {
          current[j] = Math.min(
            current[j - 1] + 1,
            previous[j] + 1,
            previous[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)
          );
        }

        for (let j = 0; j <= b.length; j++) {
          previous[j] = current[j];
        }
      }

      return previous[b.length];
    }

    function containsTarget(text) {
      const normalized = normalizeText(text);

      // Erkennt das Wort auch innerhalb längerer Wörter.
      // Beispiele: Schlange, Warteschlange, Schlangenlinien.
      if (normalized.includes("schlange")) {
        return true;
      }

      // Zusätzliche Toleranz für kleinere OCR-Fehler.
      // Es werden Abschnitte der ungefähren Wortlänge geprüft.
      for (let i = 0; i <= normalized.length - 7; i++) {
        const part = normalized.slice(i, i + 8);

        if (levenshtein(part, "schlange") <= 1) {
          return true;
        }
      }

      return false;
    }

    function clearStatus() {
      clearTimeout(statusTimer);
      statusBox.className = "";
      statusBox.textContent = "";
      statusBox.style.display = "none";
    }

    function showResult(blocked) {
      clearTimeout(statusTimer);

      statusBox.className = blocked ? "blocked" : "posted";
      statusBox.textContent = blocked
        ? "✕ BLOCKIERT"
        : "✓ GEPOSTET";

      statusBox.style.display = "block";

      statusTimer = setTimeout(() => {
        clearStatus();
      }, 1800);
    }

    function prepareImage() {
      if (!video.videoWidth || !video.videoHeight) {
        return false;
      }

      const maxWidth = 1280;
      const scale = Math.min(1, maxWidth / video.videoWidth);

      canvas.width = Math.round(video.videoWidth * scale);
      canvas.height = Math.round(video.videoHeight * scale);

      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const image = ctx.getImageData(
        0, 0, canvas.width, canvas.height
      );

      const data = image.data;

      for (let i = 0; i < data.length; i += 4) {
        const gray =
          0.299 * data[i] +
          0.587 * data[i + 1] +
          0.114 * data[i + 2];

        const contrast = Math.max(
          0,
          Math.min(255, (gray - 128) * 1.5 + 128)
        );

        data[i] = contrast;
        data[i + 1] = contrast;
        data[i + 2] = contrast;
      }

      ctx.putImageData(image, 0, 0);
      return true;
    }

    async function scan(mySession) {
      if (!running || scanning || !worker) return;
      if (!prepareImage()) return;

      scanning = true;

      try {
        const first = await worker.recognize(canvas);

        if (!running || mySession !== session) return;

        let text = (first.data.text || "").trim();

        // Zweiter Versuch bei leerem Text oder geringer Sicherheit.
        if (!text || first.data.confidence < 60) {
          if (prepareImage()) {
            const second = await worker.recognize(canvas);

            if (!running || mySession !== session) return;

            const secondText = (second.data.text || "").trim();

            // Beide Erkennungsversuche berücksichtigen.
            if (containsTarget(secondText)) {
              text = text + " " + secondText;
            } else if (!text && secondText) {
              text = secondText;
            }
          }
        }

        // Ohne erkannten Text darf kein Status erscheinen.
        if (!text.trim()) {
          clearStatus();
          lastResult = null;
          info.textContent = "Kein lesbarer Text erkannt.";
          return;
        }

        const blocked = containsTarget(text);

        if (
          blocked !== lastResult ||
          statusBox.style.display === "none"
        ) {
          showResult(blocked);
        }

        lastResult = blocked;
        info.textContent = "Texterkennung aktiv.";

      } catch (error) {
        console.error("OCR-Fehler:", error);

        if (running && mySession === session) {
          clearStatus();
          lastResult = null;
          info.textContent = "Texterkennung fehlgeschlagen. Erneuter Versuch läuft.";
        }
      } finally {
        scanning = false;
      }
    }

    async function startCamera() {
      if (running) return;

      startButton.disabled = true;
      info.textContent = "Kamera wird gestartet …";
      clearStatus();

      try {
        if (!window.isSecureContext) {
          throw new Error(
            "Bitte öffne diese Seite über eine HTTPS-Adresse."
          );
        }

        if (!navigator.mediaDevices?.getUserMedia) {
          throw new Error(
            "Kamerazugriff nicht verfügbar. Öffne den Link direkt in Safari."
          );
        }

        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        });

        video.srcObject = stream;
        await video.play();

        info.textContent = "Kamera läuft. Texterkennung wird geladen …";

        if (!worker) {
          worker = await Tesseract.createWorker("deu");
        }

        session++;
        const mySession = session;
        running = true;
        lastResult = null;

        startButton.disabled = true;
        stopButton.disabled = false;
        info.textContent = "Kamera aktiv. Text wird geprüft …";

        scanTimer = setInterval(() => scan(mySession), 1200);
        scan(mySession);

      } catch (error) {
        console.error("Startfehler:", error);
        stopCamera();

        if (error.name === "NotAllowedError") {
          info.textContent =
            "Kamerazugriff verweigert. Erlaube Safari den Kamerazugriff.";
        } else if (error.name === "NotFoundError") {
          info.textContent = "Keine Kamera gefunden.";
        } else if (error.name === "NotReadableError") {
          info.textContent =
            "Kamera ist belegt. Schließe andere Apps, die sie verwenden.";
        } else {
          info.textContent =
            "Start fehlgeschlagen: " + (error.message || error.name);
        }

        startButton.disabled = false;
      }
    }

    function stopCamera() {
      running = false;
      session++;

      clearInterval(scanTimer);
      clearTimeout(statusTimer);

      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      video.pause();
      video.srcObject = null;

      clearStatus();
      lastResult = null;

      startButton.disabled = false;
      stopButton.disabled = true;
      info.textContent = "Kamera gestoppt.";
    }

    startButton.addEventListener("click", startCamera);
    stopButton.addEventListener("click", stopCamera);

    window.addEventListener("pagehide", stopCamera);
  </script>
</body>
</html>
